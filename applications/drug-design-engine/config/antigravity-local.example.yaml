schema_version: "1"
image: localhost/dde-antigravity-arm64:agy-1.5.9
model: gemini-4-hydrogen-high
command_args:
  - --model
  - gemini-4-hydrogen-high
env:
  AGY_MODEL: gemini-4-hydrogen-high
  DDE_PACE_DIR: /tmp/dde-pace
  PYTHONDONTWRITEBYTECODE: "1"
